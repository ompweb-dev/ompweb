name: Publish npm package

on:
  push:
    tags:
      - "v*"

env:
  TAG: ${{ github.ref_name }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "$TAG" = "v$VERSION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@^11.5.1
      - run: npm ci
      # The package's Windows tray, built from this tag's native/tray rather than the committed copy (#530).
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
      - name: Build the Windows tray
        run: sh scripts/build-tray.sh
      # The omp runner this release ships against and records: the newest published release of the fork (ompweb-dev/oh-my-pi,
      # which builds and releases it) that attaches every platform's runner and whose ompweb-omp.json names this ompweb's
      # RUNNER_PROTOCOL, written into omp-runner.json here (the npm package and the binaries bake it in; not committed back).
      # None fails the release. Pinned before the tests and builds so everything runs against the runner that ships.
      - name: Pin the newest omp runner of the fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npx bun scripts/fetch-runner.ts --latest linux-x64
          echo "OMP_TAG=$(node -p 'require("./omp-runner.json").tag')" >> "$GITHUB_ENV"
      # Match Verify PR: allow isolated fixtures, never control of the runner's service.
      - name: Allow isolated native fixture scopes
        run: |
          rule="polkit.addRule(function(action, subject) { if (action.id === 'org.freedesktop.systemd1.manage-units' && subject.user === '$(id -un)' && /\\.scope$/.test(action.lookup('unit') || '')) { return polkit.Result.YES; } });"
          printf '%s\n' "$rule" | sudo tee /etc/polkit-1/rules.d/49-ompweb-fixture-scopes.rules >/dev/null
          systemd-run --scope --quiet --collect --no-ask-password true
      - run: npm test
      - run: npm run build
      # The archives leave the runner out: every install fetches it from the pinned fork release (lib/omp/runner-fetch.ts).
      - name: Build the release binaries
        run: sh scripts/build-release-binaries.sh --no-runner
      - run: npm run smoke
      - run: npm run smoke -- --binary release/ompweb-linux-x64/ompweb

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            node bin/generate-release-notes.js --tag "$TAG" --output release-notes.md
            printf '\nomp: ompweb-dev/oh-my-pi %s\n' "$OMP_TAG" >> release-notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.md --draft
          fi

      - name: Attach the binaries to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/ompweb-*.tar.gz release/ompweb-*.zip --repo "$GITHUB_REPOSITORY" --clobber

      # Before npm: a draft serves no archives, which the in-app update notice and host updates download.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Publish to npm
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "$PACKAGE_NAME@$VERSION" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published"
          else
            npm publish --provenance --access public
          fi

  notify-discord:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Post release notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DISCORD_WEBHOOK_URL="$(printf '%s' "$DISCORD_WEBHOOK_URL" | tr -d '\r\n')"
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*/*) ;;
            *) echo 'DISCORD_RELEASES_WEBHOOK is not a valid Discord webhook URL' >&2; exit 1 ;;
          esac

          RELEASE_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,url)"

          jq -n \
            --arg body "$(jq -r '.body' <<<"$RELEASE_JSON")" \
            --arg title "OMPWEB $TAG" \
            --arg url "$(jq -r '.url' <<<"$RELEASE_JSON")" \
            '{
              username: "OMPWEB Releases",
              embeds: [{
                title: $title,
                url: $url,
                description: $body[0:3800],
                color: 15105570,
                footer: {text: "GitHub Release"}
              }]
            }' > discord-release.json

          curl --fail-with-body \
            --header "Content-Type: application/json" \
            --data @discord-release.json \
            "$DISCORD_WEBHOOK_URL"
